{% extends "base.html" %}{% block page_heading %}Products & Inventory{% endblock %}{% block title %}Products & Inventory{% endblock %}{% block content %}<div class="container-fluid py-4"><h2>Products & Inventory</h2><div class="card shadow-sm my-4"><div class="card-body"><form method="POST" class="row g-2"><div class="col-md-3"><input name="item_name" class="form-control" placeholder="Item name" required></div><div class="col-md-2"><input name="quantity" type="number" min="0" class="form-control" placeholder="Quantity"></div><div class="col-md-2"><input name="rental_price" type="number" step="0.01" min="0" class="form-control" placeholder="Rental price/day"></div><div class="col-md-2"><input name="deposit" type="number" step="0.01" min="0" class="form-control" placeholder="Reference deposit"></div><div class="col-md-2"><select name="status" class="form-select"><option>Available</option><option>Returned</option><option>Damaged</option></select></div><div class="col-md-1"><button class="btn btn-primary w-100">Add</button></div></form></div></div><div class="card shadow-sm"><div class="table-responsive"><table class="table align-middle"><tr><th>Item</th><th>Qty</th><th>Price/Day</th><th>Reference Deposit</th><th>Status</th><th>Action</th></tr>{% for p in products %}<tr><form method="POST" action="{{url_for('update_product',product_id=p.id)}}"><td><input name="item_name" value="{{p.item_name}}" class="form-control"></td><td><input name="quantity" value="{{p.quantity}}" type="number" class="form-control"></td><td><input name="rental_price" value="{{p.rental_price}}" type="number" step="0.01" class="form-control"></td><td><input name="deposit" value="{{p.deposit}}" type="number" step="0.01" class="form-control"></td><td><select name="status" class="form-select">{% for s in ["Available","Rented","Returned","Damaged"] %}<option {% if p.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></td><td><button class="btn btn-sm btn-primary">Save</button></form></td></tr>{% endfor %}</table></div></div></div>{% endblock %}
