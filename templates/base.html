<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Rental Shop{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static',filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="{{ app_settings.theme }}" data-currency="{{ app_settings.currency_symbol }}">
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-shop"></i></div>
    <div><strong>Rental Shop</strong><small>Management System</small></div>
  </div>
  <nav class="sidebar-nav">
    <a class="{% if request.endpoint=='dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard & Reports</span></a>
    <a class="{% if request.endpoint in ['products','update_product','delete_product'] %}active{% endif %}" href="{{ url_for('products') }}"><i class="bi bi-box-seam-fill"></i><span>Products & Inventory</span></a>
    <a class="{% if request.endpoint in ['customers','add_rental'] %}active{% endif %}" href="{{ url_for('customers') }}"><i class="bi bi-people-fill"></i><span>Customers & Rentals</span></a>
    <a class="{% if request.endpoint in ['invoices','invoice_detail','download_invoice','return_rental','record_payment'] %}active{% endif %}" href="{{ url_for('invoices') }}"><i class="bi bi-receipt-cutoff"></i><span>Invoices & Search</span></a>
  </nav>
  <div class="sidebar-bottom">
    <button class="sidebar-settings" data-bs-toggle="modal" data-bs-target="#settingsModal"><i class="bi bi-gear-fill"></i><span>Settings</span></button>
  </div>
</aside>

<div class="main-area">
<header class="topbar">
  <button class="sidebar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
  <div class="topbar-title">{% block page_heading %}Rental Shop{% endblock %}</div>
  <button class="mobile-settings" data-bs-toggle="modal" data-bs-target="#settingsModal"><i class="bi bi-gear"></i></button>
</header>
<main>{% block content %}{% endblock %}</main>
</div>
</div>

<div class="modal fade" id="settingsModal" tabindex="-1">
<div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">Settings & Theme</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<form method="POST" action="{{ url_for('save_settings') }}">
<div class="modal-body">
<label class="form-label">Currency</label>
<select name="currency_symbol" class="form-select mb-3">
{% for sym,name in [("£","British Pound (£)"),("$","US Dollar ($)"),("€","Euro (€)"),("₨","Pakistani Rupee (₨)"),("﷼","Saudi Riyal (﷼)"),("د.إ","UAE Dirham (د.إ)"),("ر.ق","Qatari Riyal (ر.ق)"),("د.ك","Kuwaiti Dinar (د.ك)"),("د.ب","Bahraini Dinar (د.ب)"),("ر.ع.","Omani Rial (ر.ع.)"),("د.ا","Jordanian Dinar (د.ا)") ] %}
<option value="{{sym}}" {% if app_settings.currency_symbol==sym %}selected{% endif %}>{{name}}</option>
{% endfor %}
</select>
<label class="form-label">Custom Currency Symbol</label>
<input name="custom_currency_symbol" class="form-control mb-3" placeholder="e.g. ر.س" value="">
<label class="form-label">Theme</label>
<select name="theme" class="form-select">
<option value="light" {% if app_settings.theme=="light" %}selected{% endif %}>Light</option>
<option value="dark" {% if app_settings.theme=="dark" %}selected{% endif %}>Dark</option>
</select>
</div>
<div class="modal-footer"><button class="btn btn-primary">Save Settings</button></div>
</form>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static',filename='js/app.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
 const toggle=document.getElementById("sidebarToggle");
 const sidebar=document.getElementById("sidebar");
 if(toggle) toggle.addEventListener("click",()=>sidebar.classList.toggle("show"));
});
</script>
</body>
</html>
